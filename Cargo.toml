[package]
name = "podcounter"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.4", optional = true }
k8s-openapi = { version = "0.26.0", features = ["latest"] }
kube = { version = "2.0.0", features = ["client", "webpki-roots"] }
serde = { version = "1.0.219", features = ["derive"], optional = true }
serde_json = "1.0.143"
snafu = "0.8.9"
tokio = { version = "1.47.1", features = ["macros", "rt"] }

[features]
server = ["dep:axum", "dep:serde"]
